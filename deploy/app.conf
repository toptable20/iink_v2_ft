# iink v2 frontend — read by deploy/scripts/common.sh on the server.
APP=ft
PORT=3105                       # 127.0.0.1 only; nginx forwards iink.co.kr here (after the switch step)
HEALTH_PATH=/
START_CMD="server.js"
MEMORY_MAX=600M
KEEP_RELEASES=5
SHARED_DIRS=""                  # frontend keeps no data on the server
